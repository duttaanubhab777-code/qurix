<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d">
<title id="t">Assessment lifecycle</title><desc id="d">Qurix technical documentation diagram.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
 <style>
 .h{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
 .l{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:13px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.t{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
 .n{stroke:#cbd5e1;stroke-width:1.4;filter:url(#shadow)}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1200" height="590" rx="22" fill="url(#bg)"/>
<text x="48" y="52" class="h">Assessment lifecycle</text><text x="48" y="78" class="sub">QURIX • TARGET ARCHITECTURE • CONCEPTUAL DESIGN</text>

<rect x="55" y="125" width="220" height="84" rx="13" fill="#ede9fe" class="n"/><text x="165" y="159" text-anchor="middle" class="l">Blueprint</text><text x="165" y="183" text-anchor="middle" class="s">Versioned exam rules</text>
<rect x="330" y="125" width="220" height="84" rx="13" fill="#dcfce7" class="n"/><text x="440" y="159" text-anchor="middle" class="l">Question Bank</text><text x="440" y="183" text-anchor="middle" class="s">Approved eligible items</text>
<rect x="605" y="125" width="220" height="84" rx="13" fill="#dbeafe" class="n"/><text x="715" y="159" text-anchor="middle" class="l">Selection Engine</text><text x="715" y="183" text-anchor="middle" class="s">Filters • count • ordering</text>
<rect x="880" y="125" width="250" height="84" rx="13" fill="#fef3c7" class="n"/><text x="1005" y="159" text-anchor="middle" class="l">Test Snapshot</text><text x="1005" y="183" text-anchor="middle" class="s">Frozen question data</text>
<path d="M275 167 H320 M550 167 H595 M825 167 H870" class="a"/>
<path d="M1005 209 V280 H715 V305" class="a"/>
<rect x="605" y="310" width="220" height="84" rx="13" fill="#e0f2fe" class="n"/><text x="715" y="344" text-anchor="middle" class="l">Learner Attempt</text><text x="715" y="368" text-anchor="middle" class="s">Responses • timer • state</text>
<path d="M605 352 H440 V420" class="a"/>
<rect x="330" y="425" width="220" height="84" rx="13" fill="#fce7f3" class="n"/><text x="440" y="459" text-anchor="middle" class="l">Evaluation</text><text x="440" y="483" text-anchor="middle" class="s">Trusted key + scoring rules</text>
<path d="M550 467 H595" class="a"/>
<rect x="605" y="425" width="220" height="84" rx="13" fill="#dcfce7" class="n"/><text x="715" y="459" text-anchor="middle" class="l">Result</text><text x="715" y="483" text-anchor="middle" class="s">Score • breakdown • review</text>
<text x="715" y="550" text-anchor="middle" class="t">Snapshots preserve the exact paper and scoring version used.</text>

</svg>