<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d">
<title id="t">Backend request lifecycle</title><desc id="d">Qurix technical documentation diagram.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
 <style>
 .h{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
 .l{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:13px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.t{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
 .n{stroke:#cbd5e1;stroke-width:1.4;filter:url(#shadow)}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1200" height="590" rx="22" fill="url(#bg)"/>
<text x="48" y="52" class="h">Backend request lifecycle</text><text x="48" y="78" class="sub">QURIX • TARGET ARCHITECTURE • CONCEPTUAL DESIGN</text>

<rect x="55" y="130" width="225" height="82" rx="13" fill="#dbeafe" class="n"/><text x="167" y="164" text-anchor="middle" class="l">HTTP Request</text><text x="167" y="188" text-anchor="middle" class="s">Client / Browser</text>
<rect x="330" y="130" width="225" height="82" rx="13" fill="#ede9fe" class="n"/><text x="442" y="164" text-anchor="middle" class="l">Middleware</text><text x="442" y="188" text-anchor="middle" class="s">Auth • validation • security</text>
<rect x="605" y="130" width="225" height="82" rx="13" fill="#dcfce7" class="n"/><text x="717" y="164" text-anchor="middle" class="l">Controller</text><text x="717" y="188" text-anchor="middle" class="s">HTTP input / output</text>
<rect x="880" y="130" width="250" height="82" rx="13" fill="#fef3c7" class="n"/><text x="1005" y="164" text-anchor="middle" class="l">Service</text><text x="1005" y="188" text-anchor="middle" class="s">Business rules</text>
<path d="M280 171 H320 M555 171 H595 M830 171 H870" class="a"/>
<path d="M1005 212 V270 H717 V300" class="a"/>
<rect x="605" y="305" width="225" height="82" rx="13" fill="#fce7f3" class="n"/><text x="717" y="339" text-anchor="middle" class="l">Repository</text><text x="717" y="363" text-anchor="middle" class="s">Queries / persistence</text>
<path d="M605 346 H442 V410" class="a"/>
<rect x="330" y="415" width="225" height="82" rx="13" fill="#e0f2fe" class="n"/><text x="442" y="449" text-anchor="middle" class="l">Data Providers</text><text x="442" y="473" text-anchor="middle" class="s">MongoDB / external APIs</text>
<path d="M717 387 V525 H442" class="a"/>
<rect x="605" y="515" width="525" height="52" rx="11" fill="#fff" stroke="#cbd5e1"/><text x="867" y="547" text-anchor="middle" class="l">Consistent response / centralized error handling</text>

