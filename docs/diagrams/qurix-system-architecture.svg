<path d="M320 212 V242 H600 V265 M880 212 V242 H600" class="a"/>
<rect x="365" y="270" width="470" height="68" rx="13" fill="#dbeafe" class="n"/><text x="600" y="298" text-anchor="middle" class="l">Express REST API</text><text x="600" y="321" text-anchor="middle" class="s">Routes • validation • authentication • error handling</text>
<path d="M600 338 V365" class="a"/>
