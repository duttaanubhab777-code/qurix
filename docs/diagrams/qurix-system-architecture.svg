<rect x="440" y="530" width="320" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="600" y="559" text-anchor="middle" class="s">Cloudinary • media assets</text>
<rect x="805" y="530" width="320" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d"/><text x="965" y="559" text-anchor="middle" class="s">Redis / BullMQ • optional jobs</text>

